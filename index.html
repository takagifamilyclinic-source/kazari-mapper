<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>かざりマッパー</title>
    <style>
      :root {
        --ui: rgba(20, 20, 28, 0.88);
        --acc: #ffcf4a;
        --txt: #f2f2f6;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: var(--txt);
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
        touch-action: none;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
        touch-action: none;
        background: #000;
      }
      .layer video,
      .layer img,
      .layer canvas {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
        pointer-events: none;
      }
      #ov {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #ov polygon {
        fill: rgba(255, 207, 74, 0.1);
        stroke: var(--acc);
        stroke-width: 2;
        stroke-dasharray: 6 4;
      }
      .h {
        position: absolute;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: rgba(255, 207, 74, 0.35);
        border: 3px solid var(--acc);
        touch-action: none;
        z-index: 5;
      }
      body.proj .h,
      body.proj #bar,
      body.proj #panel,
      body.proj #ov {
        display: none;
      }
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        background: var(--ui);
        z-index: 20;
      }
      #panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(112px + env(safe-area-inset-bottom));
        padding: 8px 10px;
        background: var(--ui);
        z-index: 20;
        display: none;
        font-size: 13px;
        gap: 8px 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      #panel.on {
        display: flex;
      }
      #chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 6px;
        min-height: 34px;
      }
      .chip {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 14px;
        background: #33343f;
        font-size: 12px;
        max-width: 140px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip.sel {
        background: var(--acc);
        color: #222;
        font-weight: 700;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      button,
      select {
        font: inherit;
        font-size: 14px;
        color: var(--txt);
        background: #3a3b48;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        flex: 1;
        min-height: 44px;
      }
      button.main {
        background: var(--acc);
        color: #222;
        font-weight: 700;
      }
      button.warn {
        background: #7a2b33;
      }
      input[type="range"] {
        width: 110px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      #toast {
        position: fixed;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 13px;
        z-index: 30;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #ver {
        position: fixed;
        right: 8px;
        top: 6px;
        font-size: 10px;
        color: #777;
        z-index: 25;
      }
      body.proj #ver {
        display: none;
      }
      #empty {
        position: fixed;
        left: 0;
        right: 0;
        top: 35%;
        text-align: center;
        color: #888;
        font-size: 14px;
        line-height: 1.8;
        pointer-events: none;
      }
      body.proj #empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><svg id="ov"></svg></div>
    <div id="empty">
      下の「＋動画/画像」か「＋エフェクト」で<br />映すものを追加してください
    </div>
    <div id="ver">かざりマッパー v1.1</div>
    <div id="toast"></div>
    <div id="panel">
      <label
        >透明度 <input id="op" type="range" min="0.1" max="1" step="0.05"
      /></label>
      <label><input id="scr" type="checkbox" />加算（黒を透かす）</label>
      <label id="sndL"><input id="snd" type="checkbox" />音</label>
      <div class="row" style="flex: 1 1 100%">
        <button id="fwd">▲手前へ</button><button id="bwd">▼奥へ</button
        ><button id="rst">形をリセット</button
        ><button id="del" class="warn">削除</button>
      </div>
    </div>
    <div id="bar">
      <div id="chips"></div>
      <div class="row">
        <button id="addf" class="main">＋動画/画像</button>
        <select id="addfx">
          <option value="">＋エフェクト</option>
          <option value="rainbow">にじ</option>
          <option value="stars">ほし</option>
          <option value="wave">なみ</option>
          <option value="glow">ゆっくり色</option>
          <optgroup label="クリスマス">
            <option value="xsnow">ゆき</option>
            <option value="xlights">イルミネーション</option>
            <option value="xtree">ツリー</option>
            <option value="xbokeh">ひかりのたま</option>
          </optgroup>
        </select>
        <button id="playall">▶全再生</button>
        <button id="projb" class="main">投影</button>
      </div>
    </div>
    <input id="file" type="file" accept="video/*,image/*" multiple hidden />
    <script>
      (function () {
        "use strict";
        const $ = (s) => document.querySelector(s);
        const stage = $("#stage"),
          ov = $("#ov");
        let W = innerWidth,
          H = innerHeight;
        let layers = [],
          sel = null,
          idc = 0;
        const LS = "kazari-mapper-v1";

        /* ---------- 射影変換（4隅 → matrix3d） ---------- */
        function solve(A, b) {
          const n = b.length;
          for (let i = 0; i < n; i++) {
            let p = i;
            for (let r = i + 1; r < n; r++)
              if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
            [A[i], A[p]] = [A[p], A[i]];
            [b[i], b[p]] = [b[p], b[i]];
            for (let r = i + 1; r < n; r++) {
              const f = A[r][i] / A[i][i];
              for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
              b[r] -= f * b[i];
            }
          }
          const x = new Array(n);
          for (let i = n - 1; i >= 0; i--) {
            let s = b[i];
            for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
            x[i] = s / A[i][i];
          }
          return x;
        }
        function matrix3d(w, h, q) {
          const src = [
            [0, 0],
            [w, 0],
            [w, h],
            [0, h],
          ];
          const A = [],
            b = [];
          for (let i = 0; i < 4; i++) {
            const [x, y] = src[i],
              [X, Y] = q[i];
            A.push([x, y, 1, 0, 0, 0, -x * X, -y * X]);
            b.push(X);
            A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y]);
            b.push(Y);
          }
          const t = solve(A, b);
          const [a, bb, c, d, e, f, g, hh] = t;
          return `matrix3d(${a},${d},0,${g},${bb},${e},0,${hh},0,0,1,0,${c},${f},0,1)`;
        }
        window.__m3 = matrix3d;

        /* ---------- IndexedDB（動画・画像の実体） ---------- */
        let db = null;
        function openDB() {
          return new Promise((res) => {
            setTimeout(res, 1500); // 保存領域が応答しなくても起動できるように
            try {
              const r = indexedDB.open("kazari-mapper", 1);
              r.onupgradeneeded = () => r.result.createObjectStore("f");
              r.onsuccess = () => {
                db = r.result;
                res();
              };
              r.onerror = () => res();
            } catch (e) {
              res();
            }
          });
        }
        function dbPut(k, v) {
          return new Promise((res) => {
            if (!db) return res();
            try {
              const t = db.transaction("f", "readwrite");
              t.objectStore("f").put(v, k);
              t.oncomplete = () => res();
              t.onerror = () => res();
            } catch (e) {
              res();
            }
          });
        }
        function dbGet(k) {
          return new Promise((res) => {
            if (!db) return res(null);
            try {
              const r = db.transaction("f").objectStore("f").get(k);
              r.onsuccess = () => res(r.result || null);
              r.onerror = () => res(null);
            } catch (e) {
              res(null);
            }
          });
        }
        function dbDel(k) {
          return new Promise((res) => {
            if (!db) return res();
            try {
              const t = db.transaction("f", "readwrite");
              t.objectStore("f").delete(k);
              t.oncomplete = () => res();
              t.onerror = () => res();
            } catch (e) {
              res();
            }
          });
        }

        /* ---------- 保存 ---------- */
        function save() {
          try {
            localStorage.setItem(
              LS,
              JSON.stringify(
                layers.map((l) => ({
                  id: l.id,
                  kind: l.kind,
                  name: l.name,
                  fx: l.fx,
                  w: l.w,
                  h: l.h,
                  c: l.c,
                  op: l.op,
                  scr: l.scr,
                  snd: l.snd,
                })),
              ),
            );
          } catch (e) {}
        }

        /* ---------- レイヤー ---------- */
        function fit(aspect, n) {
          const bw = Math.min(0.6 * W, 0.6 * H * aspect),
            bh = bw / aspect,
            off = (n % 6) * 0.03;
          const cx = 0.5 + off - 0.075,
            cy = 0.5 + off - 0.075;
          const hw = bw / 2 / W,
            hh = bh / 2 / H;
          return [
            [cx - hw, cy - hh],
            [cx + hw, cy - hh],
            [cx + hw, cy + hh],
            [cx - hw, cy + hh],
          ];
        }
        function render(l) {
          const q = l.c.map(([x, y]) => [x * W, y * H]);
          l.el.style.width = l.w + "px";
          l.el.style.height = l.h + "px";
          try {
            l.el.style.transform = matrix3d(l.w, l.h, q);
          } catch (e) {}
        }
        function renderAll() {
          layers.forEach((l, i) => {
            l.el.style.zIndex = i + 1;
            render(l);
          });
          drawOv();
          chips();
        }
        function applyProps(l) {
          l.el.style.opacity = l.op;
          l.el.style.mixBlendMode = l.scr ? "screen" : "normal";
          const v = l.el.querySelector("video");
          if (v) {
            v.muted = !l.snd;
          }
        }

        function build(l, blob) {
          const el = document.createElement("div");
          el.className = "layer";
          l.el = el;
          if (l.kind === "video") {
            const v = document.createElement("video");
            v.muted = true;
            v.loop = true;
            v.playsInline = true;
            v.setAttribute("playsinline", "");
            v.setAttribute("webkit-playsinline", "");
            v.preload = "auto";
            l.url = URL.createObjectURL(blob);
            v.src = l.url;
            v.addEventListener("loadedmetadata", () => {
              if (l.fresh && v.videoWidth) {
                l.w = v.videoWidth;
                l.h = v.videoHeight;
                l.c = fit(l.w / l.h, layers.indexOf(l));
                l.fresh = false;
                save();
                renderAll();
              }
            });
            v.addEventListener(
              "canplay",
              () => {
                v.play().catch(() => {});
              },
              { once: true },
            );
            el.appendChild(v);
          } else if (l.kind === "image") {
            const im = new Image();
            l.url = URL.createObjectURL(blob);
            im.src = l.url;
            im.onload = () => {
              if (l.fresh && im.naturalWidth) {
                l.w = im.naturalWidth;
                l.h = im.naturalHeight;
                l.c = fit(l.w / l.h, layers.indexOf(l));
                l.fresh = false;
                save();
                renderAll();
              }
            };
            el.appendChild(im);
          } else {
            const cv = document.createElement("canvas");
            cv.width = l.w;
            cv.height = l.h;
            l.cv = cv;
            l.parts = null;
            el.appendChild(cv);
          }
          stage.insertBefore(el, ov);
          applyProps(l);
        }
        function newId() {
          return "L" + Date.now().toString(36) + idc++;
        }
        async function addFile(f) {
          const kind = f.type.startsWith("video")
            ? "video"
            : f.type.startsWith("image")
              ? "image"
              : null;
          if (!kind) return;
          const l = {
            id: newId(),
            kind,
            name: f.name.replace(/\.[^.]+$/, ""),
            w: 640,
            h: 360,
            c: fit(16 / 9, layers.length),
            op: 1,
            scr: false,
            snd: false,
            fresh: true,
          };
          layers.push(l);
          build(l, f);
          sel = l.id;
          renderAll();
          panel();
          dbPut(l.id, f);
          save();
        }
        function addFx(fx) {
          const names = {
            rainbow: "にじ",
            stars: "ほし",
            wave: "なみ",
            glow: "ゆっくり色",
            xsnow: "🎄ゆき",
            xlights: "🎄イルミ",
            xtree: "🎄ツリー",
            xbokeh: "🎄ひかりのたま",
          };
          const l = {
            id: newId(),
            kind: "fx",
            fx,
            name: "✨" + names[fx],
            w: 640,
            h: 360,
            c: fit(16 / 9, layers.length),
            op: 1,
            scr: [
              "stars",
              "wave",
              "xsnow",
              "xlights",
              "xtree",
              "xbokeh",
            ].includes(fx),
            snd: false,
          };
          layers.push(l);
          build(l, null);
          sel = l.id;
          renderAll();
          panel();
          save();
        }
        function getSel() {
          return layers.find((l) => l.id === sel) || null;
        }

        /* ---------- エフェクト描画（全部まとめて1ループ） ---------- */
        function drawFx(l, t) {
          const cv = l.cv,
            g = cv.getContext("2d"),
            w = cv.width,
            h = cv.height;
          if (l.fx === "rainbow") {
            const gr = g.createLinearGradient(0, 0, w, 0);
            const o = (t / 20) % 360;
            for (let i = 0; i <= 6; i++)
              gr.addColorStop(i / 6, `hsl(${(o + i * 60) % 360},90%,55%)`);
            g.fillStyle = gr;
            g.fillRect(0, 0, w, h);
          } else if (l.fx === "glow") {
            const hu = (t / 40) % 360;
            const gr = g.createRadialGradient(
              w / 2,
              h / 2,
              10,
              w / 2,
              h / 2,
              w * 0.6,
            );
            gr.addColorStop(0, `hsl(${hu},90%,65%)`);
            gr.addColorStop(1, `hsl(${(hu + 60) % 360},90%,30%)`);
            g.fillStyle = gr;
            g.fillRect(0, 0, w, h);
          } else if (l.fx === "wave") {
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            for (let k = 0; k < 4; k++) {
              g.strokeStyle = `hsl(${(t / 30 + k * 70) % 360},90%,60%)`;
              g.lineWidth = 6;
              g.beginPath();
              for (let x = 0; x <= w; x += 8) {
                const y =
                  h / 2 +
                  Math.sin(x / 70 + t / 500 + k) * (h * 0.18) +
                  (k - 1.5) * 30;
                x ? g.lineTo(x, y) : g.moveTo(x, y);
              }
              g.stroke();
            }
          } else if (l.fx === "stars") {
            if (!l.parts) {
              l.parts = [];
              for (let i = 0; i < 70; i++)
                l.parts.push({
                  x: Math.random() * w,
                  y: Math.random() * h,
                  r: 2 + Math.random() * 5,
                  p: Math.random() * 6.3,
                  s: 0.5 + Math.random() * 2,
                });
            }
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            for (const s of l.parts) {
              const a =
                0.35 + 0.65 * Math.abs(Math.sin((t / 1000) * s.s + s.p));
              g.globalAlpha = a;
              g.fillStyle = "#fff6c8";
              g.beginPath();
              g.arc(s.x, s.y, s.r, 0, 6.3);
              g.fill();
              g.globalAlpha = a * 0.25;
              g.beginPath();
              g.arc(s.x, s.y, s.r * 3, 0, 6.3);
              g.fill();
            }
            g.globalAlpha = 1;
          } else if (l.fx === "xsnow") {
            if (!l.parts) {
              l.parts = [];
              for (let i = 0; i < 60; i++)
                l.parts.push({
                  x: Math.random() * w,
                  y: Math.random() * h,
                  r: 1.5 + Math.random() * 3.5,
                  v: 20 + Math.random() * 40,
                  p: Math.random() * 6.3,
                });
            }
            const dt = Math.min(0.1, (t - (l.tp || t)) / 1000);
            l.tp = t;
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            g.fillStyle = "#fff";
            for (const s of l.parts) {
              s.y += s.v * dt;
              s.x += Math.sin(t / 900 + s.p) * 12 * dt;
              if (s.y > h + 5) {
                s.y = -5;
                s.x = Math.random() * w;
              }
              g.globalAlpha = 0.55 + 0.4 * (s.r / 5);
              g.beginPath();
              g.arc(s.x, s.y, s.r, 0, 6.3);
              g.fill();
            }
            g.globalAlpha = 1;
          } else if (l.fx === "xlights") {
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            const cols = [0, 130, 48, 210, 330];
            const wy = (x) => 40 + Math.sin((x / w) * Math.PI * 4) * 22;
            g.strokeStyle = "#2a5a2a";
            g.lineWidth = 3;
            g.beginPath();
            for (let x = 0; x <= w; x += 10) {
              x ? g.lineTo(x, wy(x)) : g.moveTo(x, wy(x));
            }
            g.stroke();
            for (let i = 0; i <= 24; i++) {
              const x = i * (w / 24),
                y = wy(x) + 14;
              const a = 0.35 + 0.65 * Math.abs(Math.sin(t / 500 + i * 0.9));
              g.fillStyle = `hsl(${cols[i % 5]},95%,60%)`;
              g.globalAlpha = a * 0.3;
              g.beginPath();
              g.arc(x, y, 16, 0, 6.3);
              g.fill();
              g.globalAlpha = 0.3 + a * 0.7;
              g.beginPath();
              g.arc(x, y, 6, 0, 6.3);
              g.fill();
            }
            g.globalAlpha = 1;
          } else if (l.fx === "xtree") {
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            const cx = w / 2;
            g.fillStyle = "#17803a";
            for (let k = 0; k < 3; k++) {
              const top = h * 0.12 + k * h * 0.22,
                bw = w * 0.14 + k * w * 0.08;
              g.beginPath();
              g.moveTo(cx, top);
              g.lineTo(cx - bw, top + h * 0.3);
              g.lineTo(cx + bw, top + h * 0.3);
              g.closePath();
              g.fill();
            }
            g.fillStyle = "#7a4a22";
            g.fillRect(cx - 14, h * 0.78, 28, h * 0.14);
            g.fillStyle = `rgba(255,220,80,${0.6 + 0.4 * Math.sin(t / 300)})`;
            g.beginPath();
            for (let i = 0; i < 10; i++) {
              const r = i % 2 ? 9 : 20,
                an = -Math.PI / 2 + (i * Math.PI) / 5;
              g.lineTo(cx + Math.cos(an) * r, h * 0.1 + Math.sin(an) * r);
            }
            g.closePath();
            g.fill();
            if (!l.parts) {
              l.parts = [];
              for (let i = 0; i < 22; i++) {
                const k = Math.floor(Math.random() * 3),
                  top = h * 0.12 + k * h * 0.22,
                  bw = w * 0.14 + k * w * 0.08,
                  yy = top + h * 0.06 + Math.random() * h * 0.22,
                  half = ((yy - top) / (h * 0.3)) * bw * 0.8;
                l.parts.push({
                  x: cx + (Math.random() * 2 - 1) * half,
                  y: yy,
                  hu: [0, 48, 210, 330][i % 4],
                  p: Math.random() * 6.3,
                });
              }
            }
            for (const o of l.parts) {
              const a = 0.3 + 0.7 * Math.abs(Math.sin(t / 450 + o.p));
              g.fillStyle = `hsla(${o.hu},95%,60%,${a})`;
              g.beginPath();
              g.arc(o.x, o.y, 6, 0, 6.3);
              g.fill();
            }
          } else if (l.fx === "xbokeh") {
            if (!l.parts) {
              l.parts = [];
              for (let i = 0; i < 22; i++)
                l.parts.push({
                  x: Math.random() * w,
                  y: Math.random() * h,
                  r: 14 + Math.random() * 34,
                  hu: [0, 45, 130, 40][i % 4],
                  p: Math.random() * 6.3,
                  s: 0.3 + Math.random() * 0.6,
                });
            }
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            for (const o of l.parts) {
              g.globalAlpha =
                0.12 + 0.2 * Math.abs(Math.sin((t / 1000) * o.s + o.p));
              g.fillStyle = `hsl(${o.hu},90%,60%)`;
              g.beginPath();
              g.arc(o.x, o.y, o.r, 0, 6.3);
              g.fill();
            }
            g.globalAlpha = 1;
          }
        }
        let lastT = 0;
        function loop(t) {
          if (t - lastT >= 33) {
            lastT = t;
            for (const l of layers) if (l.kind === "fx") drawFx(l, t);
          }
          requestAnimationFrame(loop);
        }

        /* ---------- 編集オーバーレイ ---------- */
        const handles = [];
        for (let i = 0; i < 4; i++) {
          const d = document.createElement("div");
          d.className = "h";
          d.dataset.i = i;
          d.style.display = "none";
          document.body.appendChild(d);
          handles.push(d);
        }
        function drawOv() {
          const l = getSel();
          if (!l) {
            ov.innerHTML = "";
            handles.forEach((h) => (h.style.display = "none"));
            return;
          }
          const q = l.c.map(([x, y]) => [x * W, y * H]);
          ov.setAttribute("width", W);
          ov.setAttribute("height", H);
          ov.innerHTML = `<polygon points="${q.map((p) => p.join(",")).join(" ")}"/>`;
          handles.forEach((h, i) => {
            h.style.display = "block";
            h.style.left = q[i][0] + "px";
            h.style.top = q[i][1] + "px";
          });
        }
        function chips() {
          const c = $("#chips");
          c.innerHTML = "";
          layers.forEach((l) => {
            const d = document.createElement("div");
            d.className = "chip" + (l.id === sel ? " sel" : "");
            d.textContent = l.name;
            d.onclick = () => {
              sel = l.id;
              drawOv();
              chips();
              panel();
            };
            c.appendChild(d);
          });
          $("#empty").style.display = layers.length ? "none" : "";
        }
        function panel() {
          const l = getSel(),
            p = $("#panel");
          if (!l) {
            p.classList.remove("on");
            return;
          }
          p.classList.add("on");
          $("#op").value = l.op;
          $("#scr").checked = l.scr;
          $("#snd").checked = l.snd;
          $("#sndL").style.display = l.kind === "video" ? "" : "none";
        }

        /* ---------- ドラッグ操作 ---------- */
        let drag = null;
        document.addEventListener(
          "pointerdown",
          (e) => {
            if (document.body.classList.contains("proj")) return;
            if (e.target.closest("#bar,#panel")) return;
            firstGesture();
            const hi = e.target.closest(".h");
            if (hi) {
              const l = getSel();
              if (!l) return;
              drag = {
                t: "corner",
                i: +hi.dataset.i,
                l,
                x: e.clientX,
                y: e.clientY,
              };
              hi.setPointerCapture(e.pointerId);
              e.preventDefault();
              return;
            }
            const le = e.target.closest(".layer");
            if (le) {
              const l = layers.find((z) => z.el === le);
              if (l) {
                sel = l.id;
                drawOv();
                chips();
                panel();
                drag = {
                  t: "move",
                  l,
                  x: e.clientX,
                  y: e.clientY,
                  c0: l.c.map((p) => p.slice()),
                };
              }
            } else {
              sel = null;
              drawOv();
              chips();
              panel();
            }
          },
          { passive: false },
        );
        document.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const l = drag.l;
          if (drag.t === "corner") {
            l.c[drag.i] = [
              Math.min(1.5, Math.max(-0.5, e.clientX / W)),
              Math.min(1.5, Math.max(-0.5, e.clientY / H)),
            ];
          } else {
            const dx = (e.clientX - drag.x) / W,
              dy = (e.clientY - drag.y) / H;
            l.c = drag.c0.map(([x, y]) => [x + dx, y + dy]);
          }
          render(l);
          drawOv();
        });
        function endDrag() {
          if (drag) {
            drag = null;
            save();
          }
        }
        document.addEventListener("pointerup", endDrag);
        document.addEventListener("pointercancel", endDrag);

        /* ---------- 投影モード（長押しで戻る） ---------- */
        let lp = null;
        function toast(m) {
          const t = $("#toast");
          t.textContent = m;
          t.style.opacity = 1;
          clearTimeout(toast.k);
          toast.k = setTimeout(() => (t.style.opacity = 0), 2500);
        }
        $("#projb").onclick = () => {
          document.body.classList.add("proj");
          sel = null;
          drawOv();
          playAll();
          toast("投影モード：画面を長押しで編集に戻ります");
        };
        stage.addEventListener("pointerdown", (e) => {
          if (!document.body.classList.contains("proj")) return;
          lp = { x: e.clientX, y: e.clientY };
          lp.t = setTimeout(() => {
            document.body.classList.remove("proj");
            lp = null;
          }, 800);
        });
        stage.addEventListener("pointermove", (e) => {
          if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 20) {
            clearTimeout(lp.t);
            lp = null;
          }
        });
        ["pointerup", "pointercancel"].forEach((ev) =>
          stage.addEventListener(ev, () => {
            if (lp) {
              clearTimeout(lp.t);
              lp = null;
            }
          }),
        );

        /* ---------- ボタン ---------- */
        function playAll() {
          layers.forEach((l) => {
            const v = l.el && l.el.querySelector("video");
            if (v) v.play().catch(() => {});
          });
        }
        let fg = false;
        function firstGesture() {
          if (!fg) {
            fg = true;
            playAll();
          }
        }
        $("#playall").onclick = () => {
          playAll();
          toast("全部の動画を再生");
        };
        $("#addf").onclick = () => $("#file").click();
        $("#file").onchange = async (e) => {
          firstGesture();
          for (const f of e.target.files) await addFile(f);
          e.target.value = "";
          playAll();
        };
        $("#addfx").onchange = (e) => {
          const v = e.target.value;
          e.target.value = "";
          if (v) addFx(v);
        };
        $("#op").oninput = (e) => {
          const l = getSel();
          if (l) {
            l.op = +e.target.value;
            applyProps(l);
            save();
          }
        };
        $("#scr").onchange = (e) => {
          const l = getSel();
          if (l) {
            l.scr = e.target.checked;
            applyProps(l);
            save();
          }
        };
        $("#snd").onchange = (e) => {
          const l = getSel();
          if (l) {
            l.snd = e.target.checked;
            applyProps(l);
            const v = l.el.querySelector("video");
            if (v) v.play().catch(() => {});
            save();
          }
        };
        $("#fwd").onclick = () => {
          const i = layers.findIndex((l) => l.id === sel);
          if (i >= 0 && i < layers.length - 1) {
            [layers[i], layers[i + 1]] = [layers[i + 1], layers[i]];
            renderAll();
            save();
          }
        };
        $("#bwd").onclick = () => {
          const i = layers.findIndex((l) => l.id === sel);
          if (i > 0) {
            [layers[i], layers[i - 1]] = [layers[i - 1], layers[i]];
            renderAll();
            save();
          }
        };
        $("#rst").onclick = () => {
          const l = getSel();
          if (l) {
            l.c = fit(l.w / l.h, layers.indexOf(l));
            renderAll();
            save();
          }
        };
        $("#del").onclick = () => {
          const l = getSel();
          if (!l) return;
          if (l.url) URL.revokeObjectURL(l.url);
          l.el.remove();
          dbDel(l.id);
          layers = layers.filter((z) => z !== l);
          sel = null;
          renderAll();
          panel();
          save();
        };
        addEventListener("resize", () => {
          W = innerWidth;
          H = innerHeight;
          renderAll();
        });
        addEventListener("orientationchange", () =>
          setTimeout(() => {
            W = innerWidth;
            H = innerHeight;
            renderAll();
          }, 300),
        );

        /* ---------- 起動 ---------- */
        (async function init() {
          await openDB();
          let saved = [];
          try {
            saved = JSON.parse(localStorage.getItem(LS) || "[]");
          } catch (e) {}
          for (const s of saved) {
            const l = Object.assign({ fresh: false }, s);
            if (l.kind === "fx") {
              layers.push(l);
              build(l, null);
            } else {
              const b = await dbGet(l.id);
              if (!b) continue;
              layers.push(l);
              build(l, b);
            }
          }
          renderAll();
          panel();
          requestAnimationFrame(loop);
          document.title = "かざりマッパー";
        })();
      })();
    </script>
  </body>
</html>
