<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>かざりマッパー</title>
    <style>
      :root {
        --ui: rgba(20, 20, 28, 0.88);
        --acc: #ffcf4a;
        --txt: #f2f2f6;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: var(--txt);
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
        touch-action: none;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
        touch-action: none;
        background: #000;
      }
      .layer video,
      .layer img,
      .layer canvas {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
        pointer-events: none;
      }
      #ov {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #ov polygon {
        fill: rgba(255, 207, 74, 0.1);
        stroke: var(--acc);
        stroke-width: 2;
        stroke-dasharray: 6 4;
      }
      .h {
        position: absolute;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border-radius: 50%;
        background: rgba(255, 207, 74, 0.2);
        border: 3px solid var(--acc);
        touch-action: none;
        z-index: 5;
      }
      body.lock .h {
        display: none !important;
      }
      #pick {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
      }
      #pick.on {
        display: flex;
      }
      #lockf {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        background: #2a2a36;
        border-radius: 12px;
        padding: 10px;
        font-size: 13px;
      }
      #lockf input {
        flex: 1 1 140px;
        min-width: 0;
        font: inherit;
        font-size: 16px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 0;
        background: #fff;
        color: #000;
        -webkit-user-select: text;
        user-select: text;
      }
      #lockf button {
        flex: none;
      }
      #pickin {
        background: #1c1c26;
        border-radius: 16px;
        padding: 12px;
        width: min(92vw, 660px);
        max-height: 86vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .ptitle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        margin: 2px 2px 10px;
      }
      .ptitle button {
        flex: none;
        min-height: 36px;
        padding: 6px 14px;
      }
      .psub {
        font-size: 12px;
        color: #aaa;
        margin: 10px 2px 6px;
      }
      .pgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 8px;
      }
      .tile {
        background: #000;
        border-radius: 12px;
        padding: 6px;
        text-align: center;
        font-size: 12px;
        border: 1px solid #333;
      }
      .tile .sw {
        height: 72px;
        border-radius: 8px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        background-color: #000;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .h.act {
        background: rgba(255, 207, 74, 0.75);
      }
      body.proj .h,
      body.proj #ui,
      body.proj #hideb,
      body.proj #ov,
      body.hide #ui {
        display: none;
      }
      #ui {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 70vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        background: var(--ui);
        z-index: 20;
      }
      #panel {
        display: none;
        font-size: 13px;
        gap: 8px 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      #panel.on {
        display: flex;
      }
      #hideb {
        position: fixed;
        top: calc(6px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        z-index: 26;
        flex: none;
        min-height: 38px;
        padding: 6px 12px;
        font-size: 13px;
        background: rgba(70, 72, 90, 0.9);
      }
      #nlab {
        flex: 1 1 100%;
        padding: 0;
        color: #bbb;
      }
      #chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        min-height: 30px;
      }
      .chip {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 14px;
        background: #33343f;
        font-size: 12px;
        max-width: 140px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip.sel {
        background: var(--acc);
        color: #222;
        font-weight: 700;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .row > * {
        white-space: nowrap;
        padding-left: 8px;
        padding-right: 8px;
      }
      button,
      select {
        font: inherit;
        font-size: 14px;
        color: var(--txt);
        background: #3a3b48;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        flex: 1;
        min-height: 44px;
      }
      button.main {
        background: var(--acc);
        color: #222;
        font-weight: 700;
      }
      button.warn {
        background: #7a2b33;
      }
      input[type="range"] {
        width: 110px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      #toast {
        position: fixed;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 13px;
        z-index: 30;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #ver {
        position: fixed;
        left: calc(8px + env(safe-area-inset-left));
        top: 6px;
        font-size: 10px;
        color: #777;
        z-index: 25;
      }
      body.proj #ver {
        display: none;
      }
      #empty {
        position: fixed;
        left: 0;
        right: 0;
        top: 35%;
        text-align: center;
        color: #888;
        font-size: 14px;
        line-height: 1.8;
        pointer-events: none;
      }
      body.proj #empty {
        display: none;
      }
      @media (min-width: 700px) and (min-height: 700px) {
        .h {
          width: 60px;
          height: 60px;
          margin: -30px 0 0 -30px;
        }
      }
      /* 横向き：操作は右端の縦列へ（映す範囲を広く見せる） */
      @media (orientation: landscape) {
        #ui {
          left: auto;
          top: 0;
          width: calc(184px + env(safe-area-inset-right));
          max-height: none;
          padding: calc(52px + env(safe-area-inset-top))
            calc(8px + env(safe-area-inset-right))
            calc(8px + env(safe-area-inset-bottom)) 8px;
        }
        #bar {
          order: 1;
        }
        #panel {
          order: 2;
          gap: 6px;
          border-top: 1px solid #444;
          padding-top: 8px;
        }
        #chips {
          flex-wrap: wrap;
          max-height: 100px;
          overflow-y: auto;
          margin-bottom: 6px;
        }
        .chip {
          max-width: 100%;
        }
        .row > * {
          flex: 1 1 40%;
          min-height: 40px;
          font-size: 13px;
        }
        .row > select {
          flex-basis: 100%;
        }
        #panel label {
          flex: 1 1 100%;
        }
        #panel input[type="range"] {
          flex: 1;
          width: auto;
          min-width: 0;
        }
        .row.nudge > button {
          flex: 1 1 20%;
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #ui {
          gap: 6px;
        }
        .row > * {
          min-height: 34px;
          padding-top: 6px;
          padding-bottom: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"><svg id="ov"></svg></div>
    <div id="empty">
      「＋動画/画像」か「＋エフェクト」で<br />映すものを追加してください
    </div>
    <div id="ver">かざりマッパー v1.8</div>
    <div id="toast"></div>
    <button id="hideb">かくす</button>
    <div id="ui">
      <div id="panel">
        <label
          >透明度 <input id="op" type="range" min="0.1" max="1" step="0.05"
        /></label>
        <label><input id="scr" type="checkbox" />加算（黒を透かす）</label>
        <label id="sndL"><input id="snd" type="checkbox" />音</label>
        <div class="row" style="flex: 1 1 100%">
          <button id="fwd">▲手前へ</button><button id="bwd">▼奥へ</button
          ><button id="dup">複製</button><button id="rst">形をリセット</button
          ><button id="del" class="warn">削除</button>
        </div>
        <div class="row nudge" style="flex: 1 1 100%">
          <span id="nlab">全体を少しずつ動かす</span>
          <button data-n="-1,0">←</button><button data-n="0,-1">↑</button
          ><button data-n="0,1">↓</button><button data-n="1,0">→</button>
        </div>
      </div>
      <div id="bar">
        <div id="chips"></div>
        <div class="row">
          <button id="addf" class="main">＋動画/画像</button>
          <button id="addfxb">＋エフェクト</button>
          <button id="playall">▶全再生</button>
          <button id="flipb">⇄反転</button>
          <button id="lockb">🔓ロック</button>
          <button id="projb" class="main">投影</button>
        </div>
      </div>
    </div>
    <div id="pick">
      <div id="pickin">
        <div class="ptitle">
          <span>エフェクトをえらぶ</span><button id="pickx">とじる</button>
        </div>
        <div id="pbody"></div>
      </div>
    </div>
    <input id="file" type="file" accept="video/*,image/*" multiple hidden />
    <script>
      (function () {
        "use strict";
        const $ = (s) => document.querySelector(s);
        const stage = $("#stage"),
          ov = $("#ov");
        let W = innerWidth,
          H = innerHeight;
        let layers = [],
          sel = null,
          selC = -1, // 微調整する角（-1 は全体）
          idc = 0;
        const LS = "kazari-mapper-v1";
        const VER = "1.8";
        let lock = false;
        try {
          lock = localStorage.getItem(LS + "-lock") === "1";
        } catch (e) {}
        let flip = false;
        try {
          flip = localStorage.getItem(LS + "-flip") === "1";
        } catch (e) {}

        /* ---------- 射影変換（4隅 → matrix3d） ---------- */
        function solve(A, b) {
          const n = b.length;
          for (let i = 0; i < n; i++) {
            let p = i;
            for (let r = i + 1; r < n; r++)
              if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
            [A[i], A[p]] = [A[p], A[i]];
            [b[i], b[p]] = [b[p], b[i]];
            for (let r = i + 1; r < n; r++) {
              const f = A[r][i] / A[i][i];
              for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
              b[r] -= f * b[i];
            }
          }
          const x = new Array(n);
          for (let i = n - 1; i >= 0; i--) {
            let s = b[i];
            for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
            x[i] = s / A[i][i];
          }
          return x;
        }
        function matrix3d(w, h, q) {
          const src = [
            [0, 0],
            [w, 0],
            [w, h],
            [0, h],
          ];
          const A = [],
            b = [];
          for (let i = 0; i < 4; i++) {
            const [x, y] = src[i],
              [X, Y] = q[i];
            A.push([x, y, 1, 0, 0, 0, -x * X, -y * X]);
            b.push(X);
            A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y]);
            b.push(Y);
          }
          const t = solve(A, b);
          const [a, bb, c, d, e, f, g, hh] = t;
          return `matrix3d(${a},${d},0,${g},${bb},${e},0,${hh},0,0,1,0,${c},${f},0,1)`;
        }
        window.__m3 = matrix3d;

        /* ---------- IndexedDB（動画・画像の実体） ---------- */
        let db = null;
        function openDB() {
          return new Promise((res) => {
            setTimeout(res, 1500); // 保存領域が応答しなくても起動できるように
            try {
              const r = indexedDB.open("kazari-mapper", 1);
              r.onupgradeneeded = () => r.result.createObjectStore("f");
              r.onsuccess = () => {
                db = r.result;
                res();
              };
              r.onerror = () => res();
            } catch (e) {
              res();
            }
          });
        }
        function dbPut(k, v) {
          return new Promise((res) => {
            if (!db) return res();
            try {
              const t = db.transaction("f", "readwrite");
              t.objectStore("f").put(v, k);
              t.oncomplete = () => res();
              t.onerror = () => res();
            } catch (e) {
              res();
            }
          });
        }
        function dbGet(k) {
          return new Promise((res) => {
            if (!db) return res(null);
            try {
              const r = db.transaction("f").objectStore("f").get(k);
              r.onsuccess = () => res(r.result || null);
              r.onerror = () => res(null);
            } catch (e) {
              res(null);
            }
          });
        }
        function dbDel(k) {
          return new Promise((res) => {
            if (!db) return res();
            try {
              const t = db.transaction("f", "readwrite");
              t.objectStore("f").delete(k);
              t.oncomplete = () => res();
              t.onerror = () => res();
            } catch (e) {
              res();
            }
          });
        }

        /* ---------- 保存 ---------- */
        function save() {
          try {
            localStorage.setItem(
              LS,
              JSON.stringify(
                layers.map((l) => ({
                  id: l.id,
                  kind: l.kind,
                  name: l.name,
                  fx: l.fx,
                  w: l.w,
                  h: l.h,
                  c: l.c,
                  op: l.op,
                  scr: l.scr,
                  snd: l.snd,
                })),
              ),
            );
          } catch (e) {}
        }

        /* ---------- レイヤー ---------- */
        function fit(aspect, n) {
          const bw = Math.min(0.6 * W, 0.6 * H * aspect),
            bh = bw / aspect,
            off = (n % 6) * 0.03;
          const cx = 0.5 + off - 0.075,
            cy = 0.5 + off - 0.075;
          const hw = bw / 2 / W,
            hh = bh / 2 / H;
          return [
            [cx - hw, cy - hh],
            [cx + hw, cy - hh],
            [cx + hw, cy + hh],
            [cx - hw, cy + hh],
          ];
        }
        function render(l) {
          let q = l.c.map(([x, y]) => [x * W, y * H]);
          if (flip) q = [q[1], q[0], q[3], q[2]]; // 左右反転（窓の外から見る用）
          l.el.style.width = l.w + "px";
          l.el.style.height = l.h + "px";
          try {
            l.el.style.transform = matrix3d(l.w, l.h, q);
          } catch (e) {}
        }
        function renderAll() {
          layers.forEach((l, i) => {
            l.el.style.zIndex = i + 1;
            render(l);
          });
          drawOv();
          chips();
        }
        function applyProps(l) {
          l.el.style.opacity = l.op;
          l.el.style.mixBlendMode = l.scr ? "screen" : "normal";
          const v = l.el.querySelector("video");
          if (v) {
            v.muted = !l.snd;
          }
        }

        function build(l, blob) {
          const el = document.createElement("div");
          el.className = "layer";
          l.el = el;
          if (l.kind === "video") {
            const v = document.createElement("video");
            v.muted = true;
            v.loop = true;
            v.playsInline = true;
            v.setAttribute("playsinline", "");
            v.setAttribute("webkit-playsinline", "");
            v.preload = "auto";
            l.url = URL.createObjectURL(blob);
            v.src = l.url;
            v.addEventListener("loadedmetadata", () => {
              if (l.fresh && v.videoWidth) {
                l.w = v.videoWidth;
                l.h = v.videoHeight;
                l.c = fit(l.w / l.h, layers.indexOf(l));
                l.fresh = false;
                save();
                renderAll();
              }
            });
            v.addEventListener(
              "canplay",
              () => {
                v.play().catch(() => {});
              },
              { once: true },
            );
            el.appendChild(v);
          } else if (l.kind === "image") {
            const im = new Image();
            l.url = URL.createObjectURL(blob);
            im.src = l.url;
            im.onload = () => {
              if (l.fresh && im.naturalWidth) {
                l.w = im.naturalWidth;
                l.h = im.naturalHeight;
                l.c = fit(l.w / l.h, layers.indexOf(l));
                l.fresh = false;
                save();
                renderAll();
              }
            };
            el.appendChild(im);
          } else {
            const cv = document.createElement("canvas");
            cv.width = l.w;
            cv.height = l.h;
            l.cv = cv;
            l.parts = null;
            el.appendChild(cv);
          }
          stage.insertBefore(el, ov);
          applyProps(l);
        }
        function newId() {
          return "L" + Date.now().toString(36) + idc++;
        }
        async function addFile(f) {
          const kind = f.type.startsWith("video")
            ? "video"
            : f.type.startsWith("image")
              ? "image"
              : null;
          if (!kind) return;
          const l = {
            id: newId(),
            kind,
            name: f.name.replace(/\.[^.]+$/, ""),
            w: 640,
            h: 360,
            c: fit(16 / 9, layers.length),
            op: 1,
            scr: false,
            snd: false,
            fresh: true,
          };
          layers.push(l);
          build(l, f);
          sel = l.id;
          renderAll();
          panel();
          dbPut(l.id, f);
          save();
        }
        /* エフェクトと絵の一覧（季節ごと）。[id, 名前, 絵文字, 見本の背景] */
        const PICK = [
          [
            "もよう",
            [
              [
                "rainbow",
                "にじ",
                "🌈",
                "linear-gradient(90deg,#f33,#fa3,#ff3,#3c3,#39f,#93f)",
              ],
              ["stars", "ほし", "✨", "#05061a"],
              ["wave", "なみ", "🌊", "linear-gradient(#013,#06a)"],
              ["glow", "ゆっくり色", "🎨", "linear-gradient(135deg,#f6a,#6af)"],
            ],
          ],
          [
            "クリスマス",
            [
              ["xsnow", "ゆき", "❄️", "#0a1428"],
              ["xlights", "イルミネーション", "💡", "#140a0a"],
              ["xtree", "ツリー", "🎄", "#04140a"],
              ["xbokeh", "ひかりのたま", "🔮", "#1a0f05"],
              ["a_sleigh", "サンタのそり"],
              ["a_reindeer", "トナカイ"],
              ["a_santa", "サンタ"],
              ["a_snowman", "ゆきだるま"],
              ["a_penguin", "ペンギン"],
              ["a_presents", "プレゼント"],
              ["a_house", "おかしのいえ"],
              ["a_bells", "ベル"],
            ],
          ],
          [
            "お正月",
            [
              ["a_kadomatsu", "門松"],
              ["a_kagamimochi", "鏡もち"],
              ["a_daruma", "だるま"],
              ["a_shishimai", "獅子舞"],
            ],
          ],
          [
            "節分",
            [
              ["a_akaoni", "赤おに"],
              ["a_aooni", "青おに"],
              ["a_mamemasu", "豆ます"],
              ["a_ehomaki", "恵方巻き"],
            ],
          ],
          [
            "バレンタイン",
            [
              ["sheart", "ハート", "💗", "#1a0510"],
              ["a_chocobox", "チョコの箱"],
              ["a_bearheart", "ハートのくま"],
              ["a_roses", "バラの花束"],
              ["a_heartballoon", "ハートの風船"],
            ],
          ],
          [
            "ひなまつり",
            [
              ["a_odairi", "おだいりさま"],
              ["a_ohina", "おひなさま"],
              ["a_bonbori", "ぼんぼり"],
              ["a_momo", "桃の花"],
            ],
          ],
          [
            "春・夏・秋",
            [
              ["ssakura", "桜ふぶき", "🌸", "#1a0a12"],
              ["shanabi", "花火", "🎆", "#05051a"],
              ["shotaru", "ほたる", "🟢", "#020a04"],
              ["smomiji", "もみじ", "🍁", "#1a0804"],
            ],
          ],
        ];
        const FXNAME = {};
        PICK.forEach(([, items]) =>
          items.forEach(([id, n]) => (FXNAME[id] = n)),
        );
        function addFx(fx) {
          const art = fx.startsWith("a_") || fx.startsWith("c_");
          const wide = !art || fx === "a_sleigh" || fx === "a_reindeer";
          const l = {
            id: newId(),
            kind: "fx",
            fx,
            name: (art ? "" : "✨") + (FXNAME[fx] || fx),
            w: wide ? 640 : 480,
            h: wide ? 360 : 480,
            c: fit(wide ? 16 / 9 : 1, layers.length),
            op: 1,
            scr:
              art ||
              fx[0] === "x" ||
              (fx[0] === "s" && fx !== "stars") ||
              ["stars", "wave"].includes(fx),
            snd: false,
          };
          layers.push(l);
          build(l, null);
          sel = l.id;
          renderAll();
          panel();
          save();
        }
        function getSel() {
          return layers.find((l) => l.id === sel) || null;
        }

        /* ---------- エフェクト描画（全部まとめて1ループ） ---------- */
        const artImg = {};
        function getArt(n) {
          if (!artImg[n]) {
            const im = new Image();
            im.src = "./art/" + n + ".webp";
            artImg[n] = im;
          }
          return artImg[n];
        }
        /* 絵に動きをつける（黒背景の絵＋加算で透かす） */
        function drawArt(l, t, g, w, h) {
          const n = l.fx.slice(2),
            chara = l.fx[0] === "c",
            im = chara ? charaImg[n] || BLANK : getArt(n);
          g.setTransform(1, 0, 0, 1, 0, 0);
          g.fillStyle = "#000";
          g.fillRect(0, 0, w, h);
          if (!im.complete || !im.naturalWidth) return;
          const s = t / 1000,
            ar = im.naturalWidth / im.naturalHeight;
          let dw,
            dh,
            x = w / 2,
            y = h / 2,
            rot = 0,
            sx = 1,
            sy = 1,
            py = 0.5;
          if (n === "sleigh") {
            // 右から左へ飛ぶ（絵が左向き）
            dh = h * 0.62;
            dw = dh * ar;
            const p = (s / 9) % 1;
            x = w + dw / 2 - p * (w + dw);
            y = h * 0.5 + Math.sin(s * 1.6) * h * 0.1;
            rot = Math.sin(s * 1.6 + 1) * 0.05;
          } else if (n === "reindeer") {
            // 左から右へ走る（絵が右向き）
            dh = h * 0.8;
            dw = dh * ar;
            const p = (s / 6) % 1;
            x = -dw / 2 + p * (w + dw);
            y = h * 0.55 - Math.abs(Math.sin(s * 5)) * h * 0.1;
            rot = Math.sin(s * 5) * 0.06;
          } else {
            dh = h * 0.86;
            dw = dh * ar;
            py = 1; // 足もとを軸にする
            y = h * 0.95;
            if (n === "santa") rot = Math.sin(s * 2) * 0.07;
            else if (n === "snowman") {
              const b = Math.sin(s * 3);
              sy = 1 + b * 0.04;
              sx = 1 - b * 0.04;
            } else if (n === "penguin") {
              rot = Math.sin(s * 4) * 0.1;
              x = w / 2 + Math.sin(s * 2) * w * 0.04;
            } else if (n === "presents") {
              const b = Math.max(0, Math.sin(s * 2.5));
              y = h * 0.95 - b * h * 0.03;
              sy = 1 + b * 0.03;
            } else if (n === "house") {
              const b = Math.sin(s * 1.5);
              sx = sy = 1 + b * 0.02;
            } else if (n === "bells" || n === "bonbori") {
              py = 0; // 上を軸にゆれる
              y = h * 0.05;
              rot =
                Math.sin(s * (n === "bells" ? 3.2 : 1.4)) *
                (n === "bells" ? 0.22 : 0.06);
            } else if (n === "daruma") {
              rot = Math.sin(s * 2.4) * 0.16; // 起き上がりこぼし
            } else if (n === "akaoni" || n === "aooni") {
              const b = Math.abs(Math.sin(s * (n === "akaoni" ? 3 : 2.6)));
              y = h * 0.95 - b * h * 0.05;
              rot = Math.sin(s * 1.5) * 0.05;
            } else if (n === "shishimai") {
              rot = Math.sin(s * 3) * 0.1;
              x = w / 2 + Math.sin(s * 1.5) * w * 0.05;
            } else if (n === "heartballoon") {
              py = 0.5; // ふわふわ浮かぶ
              y = h * 0.5 + Math.sin(s * 1.3) * h * 0.06;
              rot = Math.sin(s * 0.9) * 0.08;
              dh = h * 0.8;
              dw = dh * ar;
            } else if (n === "bearheart" || n === "odairi" || n === "ohina") {
              rot = Math.sin(s * 1.6) * 0.04;
            } else if (n === "chocobox" || n === "roses" || n === "momo") {
              const b = Math.sin(s * 2);
              sx = sy = 1 + b * 0.025;
            } else if (
              n === "kadomatsu" ||
              n === "kagamimochi" ||
              n === "mamemasu" ||
              n === "ehomaki"
            ) {
              const b = Math.sin(s * 1.5);
              sx = sy = 1 + b * 0.02;
            } else if (chara) {
              // キャラ：小さく跳ねて、少し揺れる（キャラごとに少しずらす）
              const k = (n.charCodeAt(0) + n.length) % 7;
              const b = Math.abs(Math.sin(s * (1.8 + k * 0.12) + k));
              y = h * 0.95 - b * h * 0.045;
              rot = Math.sin(s * 1.3 + k) * 0.05;
              sy = 1 + b * 0.02;
            }
          }
          g.translate(x, y);
          g.rotate(rot);
          g.scale(sx, sy);
          g.drawImage(im, -dw / 2, -dh * py, dw, dh);
          g.setTransform(1, 0, 0, 1, 0, 0);
        }
        /* 季節のエフェクト（絵なし・軽い） */
        function seedParts(l, n, w, h, f) {
          if (!l.parts) {
            l.parts = [];
            for (let i = 0; i < n; i++) l.parts.push(f(i, w, h));
          }
          const dt = Math.min(0.1, (l._t - (l.tp || l._t)) / 1000);
          l.tp = l._t;
          return dt;
        }
        function petal(g, x, y, r, rot, col) {
          g.save();
          g.translate(x, y);
          g.rotate(rot);
          g.fillStyle = col;
          g.beginPath();
          g.moveTo(0, -r);
          g.bezierCurveTo(r * 0.9, -r * 0.6, r * 0.7, r * 0.8, 0, r);
          g.bezierCurveTo(-r * 0.7, r * 0.8, -r * 0.9, -r * 0.6, 0, -r);
          g.fill();
          g.restore();
        }
        function leaf(g, x, y, r, rot, col) {
          g.save();
          g.translate(x, y);
          g.rotate(rot);
          g.fillStyle = col;
          g.beginPath();
          for (let i = 0; i < 10; i++) {
            const rr = i % 2 ? r * 0.45 : r,
              an = -Math.PI / 2 + (i * Math.PI) / 5;
            g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr);
          }
          g.closePath();
          g.fill();
          g.fillRect(-1, r * 0.3, 2, r * 0.9);
          g.restore();
        }
        function heart(g, x, y, r, col) {
          g.fillStyle = col;
          g.beginPath();
          g.moveTo(x, y + r * 0.9);
          g.bezierCurveTo(
            x - r * 1.4,
            y - r * 0.1,
            x - r * 0.7,
            y - r * 1.2,
            x,
            y - r * 0.4,
          );
          g.bezierCurveTo(
            x + r * 0.7,
            y - r * 1.2,
            x + r * 1.4,
            y - r * 0.1,
            x,
            y + r * 0.9,
          );
          g.fill();
        }
        function drawSeason(l, t, g, w, h) {
          const f = l.fx;
          l._t = t;
          if (f === "ssakura" || f === "smomiji") {
            const sak = f === "ssakura";
            const dt = seedParts(l, sak ? 55 : 35, w, h, () => ({
              x: Math.random() * w,
              y: Math.random() * h,
              r: sak ? 5 + Math.random() * 6 : 9 + Math.random() * 9,
              v: 25 + Math.random() * 35,
              p: Math.random() * 6.3,
              rv: (Math.random() - 0.5) * 3,
              hu: sak
                ? 335 + Math.random() * 20
                : [0, 15, 30, 45][Math.floor(Math.random() * 4)],
            }));
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            for (const o of l.parts) {
              o.y += o.v * dt;
              o.x += (Math.sin(t / 800 + o.p) * 25 + (sak ? 15 : 5)) * dt;
              if (o.y > h + 20 || o.x > w + 20) {
                o.y = -20;
                o.x = Math.random() * w - w * 0.1;
              }
              const rot = o.p + (t / 1000) * o.rv;
              if (sak)
                petal(g, o.x, o.y, o.r, rot, `hsla(${o.hu},85%,82%,0.95)`);
              else
                leaf(
                  g,
                  o.x,
                  o.y,
                  o.r,
                  rot,
                  `hsl(${o.hu},90%,${45 + (o.hu % 15)}%)`,
                );
            }
            return true;
          }
          if (f === "shotaru") {
            const dt = seedParts(l, 26, w, h, () => ({
              x: Math.random() * w,
              y: h * 0.2 + Math.random() * h * 0.75,
              p: Math.random() * 6.3,
              q: Math.random() * 6.3,
              sp: 0.4 + Math.random() * 0.8,
            }));
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            const s2 = t / 1000;
            for (const o of l.parts) {
              o.x += Math.cos(s2 * o.sp + o.p) * 18 * dt;
              o.y += Math.sin(s2 * o.sp * 1.3 + o.q) * 12 * dt;
              if (o.x < -10) o.x = w + 10;
              if (o.x > w + 10) o.x = -10;
              if (o.y < 0) o.y = h;
              if (o.y > h) o.y = 0;
              const a = Math.max(0, Math.sin(s2 * o.sp * 2 + o.p));
              const gr = g.createRadialGradient(o.x, o.y, 0, o.x, o.y, 16);
              gr.addColorStop(0, `rgba(220,255,120,${a})`);
              gr.addColorStop(0.25, `rgba(170,255,80,${a * 0.6})`);
              gr.addColorStop(1, "rgba(120,255,60,0)");
              g.fillStyle = gr;
              g.beginPath();
              g.arc(o.x, o.y, 16, 0, 6.3);
              g.fill();
            }
            return true;
          }
          if (f === "sheart") {
            const dt = seedParts(l, 22, w, h, () => ({
              x: Math.random() * w,
              y: Math.random() * h,
              r: 8 + Math.random() * 14,
              v: 18 + Math.random() * 25,
              p: Math.random() * 6.3,
              hu: [340, 350, 0, 320][Math.floor(Math.random() * 4)],
            }));
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            for (const o of l.parts) {
              o.y -= o.v * dt;
              if (o.y < -30) {
                o.y = h + 30;
                o.x = Math.random() * w;
              }
              const x = o.x + Math.sin(t / 700 + o.p) * 14;
              const pul = 1 + Math.sin(t / 300 + o.p) * 0.08;
              g.globalAlpha = 0.85;
              heart(g, x, o.y, o.r * pul, `hsl(${o.hu},90%,62%)`);
            }
            g.globalAlpha = 1;
            return true;
          }
          if (f === "shanabi") {
            if (!l.bursts) l.bursts = [];
            if (!l.nb || t > l.nb) {
              l.nb = t + 500 + Math.random() * 900;
              const n = 46,
                hu = Math.floor(Math.random() * 360),
                x = w * (0.2 + Math.random() * 0.6),
                y = h * (0.2 + Math.random() * 0.4),
                sp = Math.min(w, h) * (0.28 + Math.random() * 0.15);
              l.bursts.push({ x, y, t0: t, n, hu, sp });
            }
            // 残像を少し残す
            g.fillStyle = "rgba(0,0,0,0.35)";
            g.fillRect(0, 0, w, h);
            l.bursts = l.bursts.filter((b) => t - b.t0 < 1800);
            for (const b of l.bursts) {
              const k = (t - b.t0) / 1800,
                rr = b.sp * (1 - Math.pow(1 - k, 3)),
                a = 1 - k;
              for (let i = 0; i < b.n; i++) {
                const an = (i / b.n) * Math.PI * 2;
                const x = b.x + Math.cos(an) * rr,
                  y = b.y + Math.sin(an) * rr + k * k * b.sp * 0.35;
                g.fillStyle = `hsla(${(b.hu + (i % 3) * 25) % 360},95%,${60 + 20 * a}%,${a})`;
                g.beginPath();
                g.arc(x, y, 2.6 * (1 - k * 0.5), 0, 6.3);
                g.fill();
              }
            }
            return true;
          }
          return false;
        }
        function drawFx(l, t) {
          const cv = l.cv,
            g = cv.getContext("2d"),
            w = cv.width,
            h = cv.height;
          if (l.fx.startsWith("a_") || l.fx.startsWith("c_"))
            return drawArt(l, t, g, w, h);
          if (l.fx[0] === "s" && l.fx !== "stars" && drawSeason(l, t, g, w, h))
            return;
          if (l.fx === "rainbow") {
            const gr = g.createLinearGradient(0, 0, w, 0);
            const o = (t / 20) % 360;
            for (let i = 0; i <= 6; i++)
              gr.addColorStop(i / 6, `hsl(${(o + i * 60) % 360},90%,55%)`);
            g.fillStyle = gr;
            g.fillRect(0, 0, w, h);
          } else if (l.fx === "glow") {
            const hu = (t / 40) % 360;
            const gr = g.createRadialGradient(
              w / 2,
              h / 2,
              10,
              w / 2,
              h / 2,
              w * 0.6,
            );
            gr.addColorStop(0, `hsl(${hu},90%,65%)`);
            gr.addColorStop(1, `hsl(${(hu + 60) % 360},90%,30%)`);
            g.fillStyle = gr;
            g.fillRect(0, 0, w, h);
          } else if (l.fx === "wave") {
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            for (let k = 0; k < 4; k++) {
              g.strokeStyle = `hsl(${(t / 30 + k * 70) % 360},90%,60%)`;
              g.lineWidth = 6;
              g.beginPath();
              for (let x = 0; x <= w; x += 8) {
                const y =
                  h / 2 +
                  Math.sin(x / 70 + t / 500 + k) * (h * 0.18) +
                  (k - 1.5) * 30;
                x ? g.lineTo(x, y) : g.moveTo(x, y);
              }
              g.stroke();
            }
          } else if (l.fx === "stars") {
            if (!l.parts) {
              l.parts = [];
              for (let i = 0; i < 70; i++)
                l.parts.push({
                  x: Math.random() * w,
                  y: Math.random() * h,
                  r: 2 + Math.random() * 5,
                  p: Math.random() * 6.3,
                  s: 0.5 + Math.random() * 2,
                });
            }
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            for (const s of l.parts) {
              const a =
                0.35 + 0.65 * Math.abs(Math.sin((t / 1000) * s.s + s.p));
              g.globalAlpha = a;
              g.fillStyle = "#fff6c8";
              g.beginPath();
              g.arc(s.x, s.y, s.r, 0, 6.3);
              g.fill();
              g.globalAlpha = a * 0.25;
              g.beginPath();
              g.arc(s.x, s.y, s.r * 3, 0, 6.3);
              g.fill();
            }
            g.globalAlpha = 1;
          } else if (l.fx === "xsnow") {
            if (!l.parts) {
              l.parts = [];
              for (let i = 0; i < 60; i++)
                l.parts.push({
                  x: Math.random() * w,
                  y: Math.random() * h,
                  r: 1.5 + Math.random() * 3.5,
                  v: 20 + Math.random() * 40,
                  p: Math.random() * 6.3,
                });
            }
            const dt = Math.min(0.1, (t - (l.tp || t)) / 1000);
            l.tp = t;
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            g.fillStyle = "#fff";
            for (const s of l.parts) {
              s.y += s.v * dt;
              s.x += Math.sin(t / 900 + s.p) * 12 * dt;
              if (s.y > h + 5) {
                s.y = -5;
                s.x = Math.random() * w;
              }
              g.globalAlpha = 0.55 + 0.4 * (s.r / 5);
              g.beginPath();
              g.arc(s.x, s.y, s.r, 0, 6.3);
              g.fill();
            }
            g.globalAlpha = 1;
          } else if (l.fx === "xlights") {
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            const cols = [0, 130, 48, 210, 330];
            const wy = (x) => 40 + Math.sin((x / w) * Math.PI * 4) * 22;
            g.strokeStyle = "#2a5a2a";
            g.lineWidth = 3;
            g.beginPath();
            for (let x = 0; x <= w; x += 10) {
              x ? g.lineTo(x, wy(x)) : g.moveTo(x, wy(x));
            }
            g.stroke();
            for (let i = 0; i <= 24; i++) {
              const x = i * (w / 24),
                y = wy(x) + 14;
              const a = 0.35 + 0.65 * Math.abs(Math.sin(t / 500 + i * 0.9));
              g.fillStyle = `hsl(${cols[i % 5]},95%,60%)`;
              g.globalAlpha = a * 0.3;
              g.beginPath();
              g.arc(x, y, 16, 0, 6.3);
              g.fill();
              g.globalAlpha = 0.3 + a * 0.7;
              g.beginPath();
              g.arc(x, y, 6, 0, 6.3);
              g.fill();
            }
            g.globalAlpha = 1;
          } else if (l.fx === "xtree") {
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            const cx = w / 2;
            g.fillStyle = "#17803a";
            for (let k = 0; k < 3; k++) {
              const top = h * 0.12 + k * h * 0.22,
                bw = w * 0.14 + k * w * 0.08;
              g.beginPath();
              g.moveTo(cx, top);
              g.lineTo(cx - bw, top + h * 0.3);
              g.lineTo(cx + bw, top + h * 0.3);
              g.closePath();
              g.fill();
            }
            g.fillStyle = "#7a4a22";
            g.fillRect(cx - 14, h * 0.78, 28, h * 0.14);
            g.fillStyle = `rgba(255,220,80,${0.6 + 0.4 * Math.sin(t / 300)})`;
            g.beginPath();
            for (let i = 0; i < 10; i++) {
              const r = i % 2 ? 9 : 20,
                an = -Math.PI / 2 + (i * Math.PI) / 5;
              g.lineTo(cx + Math.cos(an) * r, h * 0.1 + Math.sin(an) * r);
            }
            g.closePath();
            g.fill();
            if (!l.parts) {
              l.parts = [];
              for (let i = 0; i < 22; i++) {
                const k = Math.floor(Math.random() * 3),
                  top = h * 0.12 + k * h * 0.22,
                  bw = w * 0.14 + k * w * 0.08,
                  yy = top + h * 0.06 + Math.random() * h * 0.22,
                  half = ((yy - top) / (h * 0.3)) * bw * 0.8;
                l.parts.push({
                  x: cx + (Math.random() * 2 - 1) * half,
                  y: yy,
                  hu: [0, 48, 210, 330][i % 4],
                  p: Math.random() * 6.3,
                });
              }
            }
            for (const o of l.parts) {
              const a = 0.3 + 0.7 * Math.abs(Math.sin(t / 450 + o.p));
              g.fillStyle = `hsla(${o.hu},95%,60%,${a})`;
              g.beginPath();
              g.arc(o.x, o.y, 6, 0, 6.3);
              g.fill();
            }
          } else if (l.fx === "xbokeh") {
            if (!l.parts) {
              l.parts = [];
              for (let i = 0; i < 22; i++)
                l.parts.push({
                  x: Math.random() * w,
                  y: Math.random() * h,
                  r: 14 + Math.random() * 34,
                  hu: [0, 45, 130, 40][i % 4],
                  p: Math.random() * 6.3,
                  s: 0.3 + Math.random() * 0.6,
                });
            }
            g.fillStyle = "#000";
            g.fillRect(0, 0, w, h);
            for (const o of l.parts) {
              g.globalAlpha =
                0.12 + 0.2 * Math.abs(Math.sin((t / 1000) * o.s + o.p));
              g.fillStyle = `hsl(${o.hu},90%,60%)`;
              g.beginPath();
              g.arc(o.x, o.y, o.r, 0, 6.3);
              g.fill();
            }
            g.globalAlpha = 1;
          }
        }
        let lastT = 0;
        function loop(t) {
          if (t - lastT >= 33) {
            lastT = t;
            for (const l of layers) if (l.kind === "fx") drawFx(l, t);
          }
          requestAnimationFrame(loop);
        }

        /* ---------- 編集オーバーレイ ---------- */
        const handles = [];
        for (let i = 0; i < 4; i++) {
          const d = document.createElement("div");
          d.className = "h";
          d.dataset.i = i;
          d.style.display = "none";
          document.body.appendChild(d);
          handles.push(d);
        }
        function drawOv() {
          const l = getSel();
          if (!l) {
            ov.innerHTML = "";
            handles.forEach((h) => (h.style.display = "none"));
            return;
          }
          $("#nlab").textContent =
            (selC < 0
              ? "全体"
              : ["左上", "右上", "右下", "左下"][selC] + "の角") +
            "を少しずつ動かす";
          const q = l.c.map(([x, y]) => [x * W, y * H]);
          ov.setAttribute("width", W);
          ov.setAttribute("height", H);
          ov.innerHTML = `<polygon points="${q.map((p) => p.join(",")).join(" ")}"/>`;
          handles.forEach((h, i) => {
            h.style.display = "block";
            h.classList.toggle("act", i === selC);
            h.style.left = q[i][0] + "px";
            h.style.top = q[i][1] + "px";
          });
        }
        function chips() {
          const c = $("#chips");
          c.innerHTML = "";
          layers.forEach((l) => {
            const d = document.createElement("div");
            d.className = "chip" + (l.id === sel ? " sel" : "");
            d.textContent = l.name;
            d.onclick = () => {
              sel = l.id;
              selC = -1;
              drawOv();
              chips();
              panel();
            };
            c.appendChild(d);
          });
          $("#empty").style.display = layers.length ? "none" : "";
        }
        function panel() {
          const l = getSel(),
            p = $("#panel");
          if (!l) {
            p.classList.remove("on");
            return;
          }
          p.classList.add("on");
          $("#op").value = l.op;
          $("#scr").checked = l.scr;
          $("#snd").checked = l.snd;
          $("#sndL").style.display = l.kind === "video" ? "" : "none";
        }

        /* ---------- ドラッグ操作 ---------- */
        let drag = null,
          pinch = null;
        const pts = new Map();
        function doPinch() {
          const [p, q] = [...pts.values()];
          if (!p || !q) return;
          const a = pinch.a,
            b = pinch.b;
          const d0 = Math.hypot(b.x - a.x, b.y - a.y) || 1,
            d1 = Math.hypot(q.x - p.x, q.y - p.y);
          const sc = Math.max(0.05, d1 / d0);
          const th =
            Math.atan2(q.y - p.y, q.x - p.x) - Math.atan2(b.y - a.y, b.x - a.x);
          const m0x = (a.x + b.x) / 2,
            m0y = (a.y + b.y) / 2,
            m1x = (p.x + q.x) / 2,
            m1y = (p.y + q.y) / 2;
          const cs = Math.cos(th) * sc,
            sn = Math.sin(th) * sc;
          pinch.l.c = pinch.c0.map(([x, y]) => {
            const dx = x - m0x,
              dy = y - m0y;
            return [
              (m1x + dx * cs - dy * sn) / W,
              (m1y + dx * sn + dy * cs) / H,
            ];
          });
          render(pinch.l);
          drawOv();
        }
        window.__pinchTest = (l, a, b, p, q) => {
          pinch = { l, a, b, c0: l.c.map(([x, y]) => [x * W, y * H]) };
          pts.clear();
          pts.set(1, p);
          pts.set(2, q);
          doPinch();
          pinch = null;
          pts.clear();
        };
        document.addEventListener(
          "pointerdown",
          (e) => {
            if (document.body.classList.contains("proj")) return;
            if (e.target.closest("#ui,#hideb,#pick")) return;
            firstGesture();
            if (lock) return;
            if (e.isPrimary) pts.clear();
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pts.size === 2 && getSel()) {
              // 2本指：選んでいる絵を拡大縮小・回転
              const l = getSel();
              const [a, b] = [...pts.values()];
              drag = null;
              pinch = {
                l,
                a: { x: a.x, y: a.y },
                b: { x: b.x, y: b.y },
                c0: l.c.map(([x, y]) => [x * W, y * H]),
              };
              e.preventDefault();
              return;
            }
            if (pts.size > 2) return;
            const hi = e.target.closest(".h");
            if (hi) {
              const l = getSel();
              if (!l) return;
              selC = +hi.dataset.i;
              drawOv();
              drag = {
                t: "corner",
                i: +hi.dataset.i,
                l,
                x: e.clientX,
                y: e.clientY,
              };
              hi.setPointerCapture(e.pointerId);
              e.preventDefault();
              return;
            }
            const le = e.target.closest(".layer");
            if (le) {
              const l = layers.find((z) => z.el === le);
              if (l) {
                sel = l.id;
                selC = -1;
                drawOv();
                chips();
                panel();
                drag = {
                  t: "move",
                  l,
                  x: e.clientX,
                  y: e.clientY,
                  c0: l.c.map((p) => p.slice()),
                };
              }
            } else {
              sel = null;
              drawOv();
              chips();
              panel();
            }
          },
          { passive: false },
        );
        document.addEventListener("pointermove", (e) => {
          if (pts.has(e.pointerId))
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (pinch) {
            if (pts.size >= 2) doPinch();
            return;
          }
          if (!drag) return;
          const l = drag.l;
          if (drag.t === "corner") {
            l.c[drag.i] = [
              Math.min(1.5, Math.max(-0.5, e.clientX / W)),
              Math.min(1.5, Math.max(-0.5, e.clientY / H)),
            ];
          } else {
            const dx = (e.clientX - drag.x) / W,
              dy = (e.clientY - drag.y) / H;
            l.c = drag.c0.map(([x, y]) => [x + dx, y + dy]);
          }
          render(l);
          drawOv();
        });
        function endDrag(e) {
          if (e && e.pointerId != null) pts.delete(e.pointerId);
          if (pinch && pts.size < 2) {
            pinch = null;
            save();
          }
          if (drag) {
            drag = null;
            save();
          }
        }
        document.addEventListener("pointerup", endDrag);
        document.addEventListener("pointercancel", endDrag);

        /* ---------- 投影モード（長押しで戻る） ---------- */
        let lp = null;
        function toast(m) {
          const t = $("#toast");
          t.textContent = m;
          t.style.opacity = 1;
          clearTimeout(toast.k);
          toast.k = setTimeout(() => (t.style.opacity = 0), 2500);
        }
        $("#projb").onclick = () => {
          document.body.classList.add("proj");
          sel = null;
          drawOv();
          playAll();
          toast("投影モード：画面を長押しで編集に戻ります");
        };
        stage.addEventListener("pointerdown", (e) => {
          if (!document.body.classList.contains("proj")) return;
          lp = { x: e.clientX, y: e.clientY };
          lp.t = setTimeout(() => {
            document.body.classList.remove("proj");
            lp = null;
          }, 800);
        });
        stage.addEventListener("pointermove", (e) => {
          if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 20) {
            clearTimeout(lp.t);
            lp = null;
          }
        });
        ["pointerup", "pointercancel"].forEach((ev) =>
          stage.addEventListener(ev, () => {
            if (lp) {
              clearTimeout(lp.t);
              lp = null;
            }
          }),
        );

        /* ---------- ボタン ---------- */
        function playAll() {
          layers.forEach((l) => {
            const v = l.el && l.el.querySelector("video");
            if (v) v.play().catch(() => {});
          });
        }
        let fg = false;
        function firstGesture() {
          if (!fg) {
            fg = true;
            playAll();
          }
        }
        $("#playall").onclick = () => {
          playAll();
          toast("全部の動画を再生");
        };
        function flipLabel() {
          $("#flipb").textContent = flip ? "⇄反転中" : "⇄反転";
          $("#flipb").style.background = flip ? "#e0a020" : "";
          $("#flipb").style.color = flip ? "#000" : "";
        }
        flipLabel();
        $("#flipb").onclick = () => {
          flip = !flip;
          try {
            localStorage.setItem(LS + "-flip", flip ? "1" : "0");
          } catch (e) {}
          flipLabel();
          renderAll();
          toast(flip ? "左右反転：窓の外から見て正しい向き" : "左右反転を解除");
        };
        /* かくす／メニュー */
        $("#hideb").onclick = () => {
          const h = document.body.classList.toggle("hide");
          $("#hideb").textContent = h ? "☰メニュー" : "かくす";
        };
        /* 微調整（1目盛り＝画面の1点。押しっぱなしで連続） */
        function nudge(dx, dy) {
          const l = getSel();
          if (!l || lock) return;
          if (selC >= 0) {
            l.c[selC] = [l.c[selC][0] + dx / W, l.c[selC][1] + dy / H];
          } else {
            l.c = l.c.map(([x, y]) => [x + dx / W, y + dy / H]);
          }
          render(l);
          drawOv();
        }
        let nk = null;
        function nudgeStop() {
          if (nk) {
            clearTimeout(nk.a);
            clearInterval(nk.b);
            nk = null;
            save();
          }
        }
        document.querySelectorAll("[data-n]").forEach((b) => {
          const [dx, dy] = b.dataset.n.split(",").map(Number);
          b.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            nudgeStop();
            nudge(dx, dy);
            nk = {};
            nk.a = setTimeout(() => {
              if (nk) nk.b = setInterval(() => nudge(dx, dy), 50);
            }, 350);
          });
          ["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
            b.addEventListener(ev, nudgeStop),
          );
        });
        /* 複製 */
        $("#dup").onclick = async () => {
          const o = getSel();
          if (!o) return;
          const l = {
            id: newId(),
            kind: o.kind,
            fx: o.fx,
            name: o.name,
            w: o.w,
            h: o.h,
            c: o.c.map(([x, y]) => [x + 0.04, y + 0.04]),
            op: o.op,
            scr: o.scr,
            snd: false,
            fresh: false,
          };
          let b = null;
          if (o.kind !== "fx") {
            b = await dbGet(o.id);
            if (!b) {
              toast("複製できませんでした");
              return;
            }
            dbPut(l.id, b);
          }
          layers.push(l);
          build(l, b);
          applyProps(l);
          sel = l.id;
          selC = -1;
          renderAll();
          panel();
          save();
          playAll();
          toast("複製しました");
        };
        $("#addf").onclick = () => $("#file").click();
        $("#file").onchange = async (e) => {
          firstGesture();
          for (const f of e.target.files) await addFile(f);
          e.target.value = "";
          playAll();
        };
        /* エフェクトの一覧（見本つき） */

        function pickSection(title, items, before) {
          const body = $("#pbody");
          {
            const t = document.createElement("div");
            t.className = "psub";
            t.textContent = title;
            body.appendChild(t);
            const g = document.createElement("div");
            g.className = "pgrid";
            items.forEach(([id, label, emo, bg]) => {
              const d = document.createElement("div");
              d.className = "tile";
              const sw = document.createElement("div");
              sw.className = "sw";
              if (id.startsWith("c_")) {
                sw.style.backgroundImage = "url(" + charaURL[id.slice(2)] + ")";
              } else if (id.startsWith("a_")) {
                const src = "./art/" + id.slice(2) + ".webp";
                sw.style.backgroundImage = "url(" + src + ")";
                const chk = new Image();
                chk.onerror = () => d.remove();
                chk.src = src;
              } else {
                sw.style.background = bg;
                sw.textContent = emo;
              }
              const n = document.createElement("div");
              n.textContent = label;
              d.appendChild(sw);
              d.appendChild(n);
              d.onclick = () => {
                $("#pick").classList.remove("on");
                addFx(id);
              };
              g.appendChild(d);
            });
            body.insertBefore(g, before || null);
            body.insertBefore(t, g);
          }
        }
        PICK.forEach(([title, items]) => pickSection(title, items));

        /* キャラ（家の中だけで使う絵）：合言葉で暗号を解く */
        const charaImg = {},
          charaURL = {};
        const BLANK = new Image();
        const CKEY = "kazari-chara-key";
        const b64u8 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
        let charaBox = null,
          charaDone = false;
        const lockSec = document.createElement("div");
        lockSec.innerHTML =
          '<div class="psub">キャラ（あいことば）</div><div id="lockf"><input id="w1" type="password" placeholder="あいことば1" autocomplete="off"><input id="w2" type="password" placeholder="あいことば2" autocomplete="off"><button id="unl" class="main">ひらく</button><span id="lmsg" style="flex:1 1 100%;color:#bbb">はこにわ と同じあいことばです</span></div>';
        $("#pbody").appendChild(lockSec);
        async function getBox() {
          if (!charaBox) {
            const r = await fetch("./chara.json", { cache: "no-store" });
            if (!r.ok) throw new Error("no pack");
            charaBox = await r.json();
          }
          return charaBox;
        }
        async function openChara(keyBytes) {
          const box = await getBox();
          const key = await crypto.subtle.importKey(
            "raw",
            keyBytes,
            "AES-GCM",
            false,
            ["decrypt"],
          );
          const plain = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64u8(box.iv) },
            key,
            b64u8(box.data),
          );
          const pack = JSON.parse(new TextDecoder().decode(plain));
          if (charaDone) return;
          charaDone = true;
          const first = lockSec;
          pack.forEach(([group, items]) => {
            const list = items.map(([id, name, data]) => {
              const url = URL.createObjectURL(
                new Blob([b64u8(data)], { type: "image/webp" }),
              );
              charaURL[id] = url;
              const im = new Image();
              im.src = url;
              charaImg[id] = im;
              FXNAME["c_" + id] = name;
              return ["c_" + id, name];
            });
            pickSection(group, list, first);
          });
          lockSec.remove();
        }
        $("#unl").onclick = async () => {
          const w1 = $("#w1").value.normalize("NFKC").trim(),
            w2 = $("#w2").value.normalize("NFKC").trim();
          if (!w1 || !w2) return;
          $("#lmsg").textContent = "たしかめています…";
          try {
            const box = await getBox();
            const base = await crypto.subtle.importKey(
              "raw",
              new TextEncoder().encode(w1 + "\u0000" + w2),
              "PBKDF2",
              false,
              ["deriveBits"],
            );
            const bits = new Uint8Array(
              await crypto.subtle.deriveBits(
                {
                  name: "PBKDF2",
                  hash: "SHA-256",
                  salt: b64u8(box.salt),
                  iterations: box.iter,
                },
                base,
                256,
              ),
            );
            await openChara(bits);
            try {
              localStorage.setItem(CKEY, btoa(String.fromCharCode(...bits)));
            } catch (e) {}
            toast("キャラを ひらきました");
          } catch (e) {
            $("#lmsg").textContent = "あいことばが ちがうようです";
          }
        };
        (async function () {
          let k = null;
          try {
            k = localStorage.getItem(CKEY);
          } catch (e) {}
          if (!k) return;
          try {
            await openChara(b64u8(k));
          } catch (e) {}
        })();
        $("#addfxb").onclick = () => $("#pick").classList.add("on");
        $("#pickx").onclick = () => $("#pick").classList.remove("on");
        $("#pick").onclick = (e) => {
          if (e.target.id === "pick") $("#pick").classList.remove("on");
        };
        /* ロック（置いたあとに誤って動かさない） */
        function lockLabel() {
          $("#lockb").textContent = lock ? "🔒ロック中" : "🔓ロック";
          $("#lockb").style.background = lock ? "#e0a020" : "";
          $("#lockb").style.color = lock ? "#000" : "";
          document.body.classList.toggle("lock", lock);
        }
        lockLabel();
        $("#lockb").onclick = () => {
          lock = !lock;
          try {
            localStorage.setItem(LS + "-lock", lock ? "1" : "0");
          } catch (e) {}
          lockLabel();
          toast(lock ? "ロック：絵は動きません" : "ロック解除：動かせます");
        };
        /* 新しい版が出ていたら読み直す */
        function chkVer() {
          if (!/^https?:/.test(location.protocol)) return;
          fetch("./version.txt?t=" + Date.now(), { cache: "no-store" })
            .then((r) => (r.ok ? r.text() : ""))
            .then((t) => {
              t = t.trim();
              if (!t || t === VER) return;
              const k = "kz-reload-" + t;
              try {
                if (sessionStorage.getItem(k)) return;
                sessionStorage.setItem(k, "1");
              } catch (e) {
                return;
              }
              location.reload();
            })
            .catch(() => {});
        }
        chkVer();
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && !document.body.classList.contains("proj"))
            chkVer();
        });
        $("#op").oninput = (e) => {
          const l = getSel();
          if (l) {
            l.op = +e.target.value;
            applyProps(l);
            save();
          }
        };
        $("#scr").onchange = (e) => {
          const l = getSel();
          if (l) {
            l.scr = e.target.checked;
            applyProps(l);
            save();
          }
        };
        $("#snd").onchange = (e) => {
          const l = getSel();
          if (l) {
            l.snd = e.target.checked;
            applyProps(l);
            const v = l.el.querySelector("video");
            if (v) v.play().catch(() => {});
            save();
          }
        };
        $("#fwd").onclick = () => {
          const i = layers.findIndex((l) => l.id === sel);
          if (i >= 0 && i < layers.length - 1) {
            [layers[i], layers[i + 1]] = [layers[i + 1], layers[i]];
            renderAll();
            save();
          }
        };
        $("#bwd").onclick = () => {
          const i = layers.findIndex((l) => l.id === sel);
          if (i > 0) {
            [layers[i], layers[i - 1]] = [layers[i - 1], layers[i]];
            renderAll();
            save();
          }
        };
        $("#rst").onclick = () => {
          const l = getSel();
          if (l) {
            l.c = fit(l.w / l.h, layers.indexOf(l));
            renderAll();
            save();
          }
        };
        $("#del").onclick = () => {
          const l = getSel();
          if (!l) return;
          if (l.url) URL.revokeObjectURL(l.url);
          l.el.remove();
          dbDel(l.id);
          layers = layers.filter((z) => z !== l);
          sel = null;
          selC = -1;
          renderAll();
          panel();
          save();
        };
        addEventListener("resize", () => {
          W = innerWidth;
          H = innerHeight;
          renderAll();
        });
        addEventListener("orientationchange", () =>
          setTimeout(() => {
            W = innerWidth;
            H = innerHeight;
            renderAll();
          }, 300),
        );

        /* ---------- 起動 ---------- */
        (async function init() {
          await openDB();
          let saved = [];
          try {
            saved = JSON.parse(localStorage.getItem(LS) || "[]");
          } catch (e) {}
          for (const s of saved) {
            const l = Object.assign({ fresh: false }, s);
            if (l.kind === "fx") {
              layers.push(l);
              build(l, null);
            } else {
              const b = await dbGet(l.id);
              if (!b) continue;
              layers.push(l);
              build(l, b);
            }
          }
          renderAll();
          panel();
          requestAnimationFrame(loop);
          document.title = "かざりマッパー";
        })();
      })();
    </script>
  </body>
</html>
